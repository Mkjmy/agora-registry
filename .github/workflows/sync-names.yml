name: sync-names

# The index's "centralised name list": the NAMES file
# (nickname | login | uid | owner | repo | repo-hash | registrant).
# After every issue event — register (opened), approve/reject
# (labeled/unlabeled), rename (edited), reject+close (closed) — this workflow
# regenerates NAMES from the member issues and commits it back to the index repo.
# Readers fetch the file via raw.githubusercontent: 1 request, no rate limit eaten.
#
# WHY IT MUST BE SIGNED: the index is a PUBLIC repo and anyone can open an issue.
# If NAMES is read as "approved" without verification, merely having permission to
# open an issue is enough to insert a fake line that every client then displays as a
# valid member — system-wide impersonation. So the bot here SIGNS NAMES with
# Ed25519, and clients verify, fail-closed: missing NAMES.pub / bad signature /
# missing signature → drop NAMES and read labels from issues instead of trusting
# the file.
#
# ONE-TIME SETUP (required; without it the workflow fails):
#   1. agora names --keygen            → take the public key, commit it as NAMES.pub
#   2. gh secret set AGORA_SIGNING_KEY <private key>
#   3. re-running the workflow generates the signed NAMES itself.

on:
  issues:
    types: [opened, edited, closed, labeled, unlabeled]
  workflow_dispatch:

# Only ONE sync run at a time (guarding against several issue events landing at
# the same moment); a new run waits for the old one to finish instead of being
# cancelled midway. Combined with the pull --rebase + push retry loop below so a
# "lost update" can never happen when two runs overlap.
concurrency:
  group: sync-names
  cancel-in-progress: false

# This workflow's default token has contents:write — that is, it is CAPABLE of
# signing NAMES. That is deliberate (the bot has to be able to sign), so the scope
# must be limited: run only from the admin's index, and the triggers above are
# only issue events, with no input from strangers. If you ever add user input,
# revisit this.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA (with a version comment) instead of a floating tag: @v4 can
      # have its contents changed, a tag can be deleted/recreated, or the action's
      # commit can gain new branches. Pinning the SHA is the only way to know you
      # are running exactly the code you read.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "stable"

      - name: Guard — only the admin's index may be signed
        env:
          # github.event.issue.title is controlled by anyone. It must NOT be
          # interpolated straight into `run:` — that is command injection (an issue
          # title containing `$(...)`, a backtick or `;` can run arbitrary commands
          # on the runner, holding a contents:write token). See the "Sync NAMES"
          # step below: the title is only used to WRITE INTO AN ENVIRONMENT
          # VARIABLE, never as a command.
          ADMIN_REPO: ${{ vars.AGORA_ADMIN_REPO }}
        run: |
          if [ -z "$ADMIN_REPO" ]; then
            echo "::error::missing repository variable AGORA_ADMIN_REPO — the workflow will be skipped because it does not know which repo may sign NAMES"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "$ADMIN_REPO" ]; then
            echo "::error::this repo ($GITHUB_REPOSITORY) is not the admin's index ($ADMIN_REPO) — refusing to sign"
            exit 1
          fi
          if [ ! -f NAMES.pub ]; then
            echo "::error::no NAMES.pub in the index. Run 'agora names --keygen' and commit NAMES.pub, otherwise every client will ignore NAMES"
            exit 1
          fi
          # NAMES.pub must PARSE, not merely exist. The guard used to only check
          # that the file was present, so a NAMES.pub accidentally containing the
          # prompt line (from redirecting --keygen's stdout) still passed CI. Then
          # the workflow would "go green" while every client failed to decode and
          # silently skipped verification — exactly the silent-corruption state this
          # guard is supposed to block.
          #
          # An Ed25519 public key = 32 bytes → base64 is 44 characters long, ending
          # in '='.
          # A regex is used instead of running agora in the guard (agora has not
          # been built at this step, and the guard should not depend on an unbuilt
          # binary).
          if ! grep -qE '^[A-Za-z0-9+/]{43}=$' NAMES.pub; then
            echo "::error::NAMES.pub is NOT a valid Ed25519 public key (needs 44 base64 characters). Most likely the output of 'agora names --keygen' was redirected by mistake."
            echo "::error::Fix: run 'agora names --keygen 2>/dev/null > NAMES.pub' and commit again."
            exit 1
          fi

      - name: Clone + build agora (private app repo → use the admin token)
        env:
          AGORA_ADMIN_TOKEN: ${{ secrets.AGORA_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          APP_REPO="$(grep -v '^#' APP_REPO 2>/dev/null | head -1 || true)"
          [ -n "$APP_REPO" ] || APP_REPO="Mkjmy/agora"

          # The token must NOT be passed in argv.
          #
          # - A URL containing the token: it sits in argv, and git also writes it
          #   into .git/config.
          # - `git -c http.extraheader=AUTHORIZATION:basic <base64>`: also in argv!
          #   An older comment in this file claimed "passed via env, not argv" —
          #   wrong. /proc/*/cmdline is world-readable on Linux, so every other
          #   process on the runner can read it, including a concurrently running
          #   pull-request process.
          # - `git -c ... $(...)` with a subcommand: the token also lands in that
          #   subcommand's argv.
          #
          # GIT_ASKPASS: git invokes a program to ask for the password, so the token
          # only lives in the env of the git/askpass processes themselves, never
          # appears in any argv, and is never written to disk.
          mkdir -p "$RUNNER_TEMP/askpass"
          cat > "$RUNNER_TEMP/askpass/ask.sh" <<'EOS'
          #!/bin/sh
          case "$1" in
            *sername*) printf '%s' "$GIT_AUTH_USERNAME" ;;
            *assword*) printf '%s' "$AGORA_ADMIN_TOKEN" ;;
          esac
          EOS
          chmod +x "$RUNNER_TEMP/askpass/ask.sh"

          GIT_ASKPASS="$RUNNER_TEMP/askpass/ask.sh" \
          GIT_TERMINAL_PROMPT=0 \
          GIT_AUTH_USERNAME=x-access-token \
            git clone --depth 1 --quiet "https://github.com/${APP_REPO}.git" app

          (cd app && go build -o ../agora ./cmd/agora)

          # Clean up early: the token is also in /proc/*/environ of finished
          # processes and cannot be revoked — shrink that window.
          rm -f "$RUNNER_TEMP/askpass/ask.sh"
          unset AGORA_ADMIN_TOKEN GIT_AUTH_USERNAME
          rm -rf app

      - name: Sync NAMES (sign)
        env:
          AGORA_SIGNING_KEY: ${{ secrets.AGORA_SIGNING_KEY }}
          # Only passed via env for use in the LOG (every workflow env var is
          # printed in the log when workflow logging is on). ${{ }} is never
          # interpolated directly into the shell command.
          TRIGGER: ${{ github.event.action }}
          TRIGGER_ISSUE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          ./agora names --index "${GITHUB_REPOSITORY}" --sign > NAMES.new
          if cmp -s NAMES NAMES.new; then
            echo "NAMES unchanged — skipping"
            exit 0
          fi
          mv NAMES.new NAMES
          git config user.name "agora-sync"
          git config user.email "agora-sync@users.noreply.github.com"
          git add NAMES
          if ! git commit -m "sync NAMES (trigger: ${TRIGGER:-manual}, issue: ${TRIGGER_ISSUE:-none})" >/dev/null 2>&1; then
            echo "NAMES already matches the index (another run synced it) — skipping"
            exit 0
          fi
          # GitDB-style retry: another run may have pushed first → pull --rebase and
          # try again, at most 5 times (prevents lost updates with two flows racing).
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              git pull --rebase --quiet origin HEAD || true
              sleep 3
            fi
            if git push --quiet; then
              echo "NAMES pushed to the index (attempt ${attempt})"
              exit 0
            fi
            echo "push fail (attempt ${attempt})"
          done
          echo "Could not push NAMES after 5 attempts — giving up" >&2
          exit 1
